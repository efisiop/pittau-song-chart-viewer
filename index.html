<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142b32">
  <title>PITTAU Song Charts</title>
  <link rel="stylesheet" href="viewer.css?v=11">
</head>
<body>
  <header class="site-header">
    <div class="brand"><span class="eyebrow">PITTAU SYSTEM</span><h1>Song Charts</h1><span class="subtitle">Rehearsal viewer</span></div>
    <a id="spotifyLink" class="spotify-link" href="#" target="_blank" rel="noopener noreferrer" hidden><img id="spotifyCover" alt="" hidden><span id="spotifyFallback" aria-hidden="true">♫</span><span><strong>Listen on Spotify</strong><small id="spotifySong"></small></span></a>
    <div class="source-controls">
      <label for="songSelect">Choose a song</label>
      <select id="songSelect"><option value="">Empty chart</option></select>
    </div>
  </header>
  <section class="controls" aria-label="Chart viewing controls">
    <button id="settingsToggle" class="settings-toggle" type="button" aria-controls="settingsPanel" aria-expanded="false">Show viewing settings</button>
    <div id="settingsPanel" class="settings-panel" hidden>
    <label>Output theme <select id="theme"><option value="2">Calm Grid</option><option value="1">Stage Large</option><option value="4">Four measures per row</option></select></label>
    <label>Musician view <select id="view"><option value="vocal">Vocal · lyrics</option><option value="pianoBacking">Backing Vocal 1 · lead cues</option><option value="piano">Piano · chords + lyrics</option><option value="instrumental">Instrumental · chords</option><option value="specialist">Specialist · chords + edited notation</option></select></label>
    <label>Key change <select id="transpose" disabled><option value="0">Original key</option></select></label>
    <label id="instrumentWrap" hidden>Instrument <select id="instrument"><option value="">All instruments</option></select></label>
    <label>Zoom <input id="zoom" type="range" min="65" max="130" value="100"><output id="zoomValue">100%</output></label>
    <button id="print" type="button">Print / PDF</button>
    </div>
  </section>
  <main>
    <aside class="sidebar" aria-label="Practice controls">
    <button id="practiceToggle" class="practice-toggle" type="button" aria-controls="practicePanel" aria-expanded="true">Hide practice</button>
    <section id="practicePanel" class="practice" aria-label="Practice mode">
      <div class="practice-label"><span class="eyebrow">PRACTICE MODE</span><strong id="position">Measure 1 · Beat 1</strong></div>
      <button id="play" type="button" disabled>▶ Start</button>
      <button id="reset" type="button" disabled>↺ Reset</button>
      <label>Tempo <input id="tempo" type="number" min="30" max="300" step="0.01" value="120" disabled> BPM</label>
      <label><input id="metronome" type="checkbox" checked disabled> Metronome</label>
      <span class="practice-hint">Click a measure to start there.</span>
    </section>
    </aside>
    <div class="score-column">
      <p id="message" role="status" aria-live="polite">Choose a song to begin.</p>
      <div id="chart" class="chart" aria-label="Song chart"></div>
    </div>
  </main>
  <script src="rhythm-notation.js"></script>
  <script src="musician-views.js"></script>
  <script src="practice-player.js"></script>
  <script src="viewer.js?v=11"></script>
</body>
</html>
